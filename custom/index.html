<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%2329241f%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2224%22%20text-anchor%3D%22middle%22%20fill%3D%22%23eee8dc%22%20font-family%3D%22serif%22%20font-size%3D%2226%22%3EE%3C/text%3E%3C/svg%3E"><title>ENLUMO カラーシミュレーター</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f2ed;color:#29241f;font:15px system-ui,sans-serif}header{padding:22px 6%;background:#fff;border-bottom:1px solid #e3dbd0;display:flex;justify-content:space-between;align-items:center}header b{font:28px Georgia;letter-spacing:5px}main{max-width:1250px;margin:auto;padding:28px;display:grid;grid-template-columns:1fr 310px;gap:28px}.stage{background:radial-gradient(#fff,#eae4db);border-radius:22px;padding:20px;text-align:center}canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 12px 10px #4a342522);transform-origin:center center}.image-frame{height:clamp(320px,65vh,660px);width:100%;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{min-width:0}.stage.sideView{background:#fff}section{min-width:0}.headerActions{display:flex;gap:20px;align-items:center}.headerActions button{font-size:12px}button{cursor:pointer;border:1px solid #d4c9bc;background:#fff;color:#29241f;border-radius:9px;padding:11px 18px;font:inherit}.active{background:#29241f;color:#fff}.tabs{display:flex;justify-content:center;gap:10px;margin-bottom:8px}aside{background:white;border-radius:20px;padding:24px}h2{font-size:20px;margin:0 0 24px}h3{font-size:15px;margin:22px 0 12px}.palette{display:flex;flex-wrap:wrap;gap:10px}.swatch{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #c7bbaa}.swatch.selected{box-shadow:0 0 0 3px #3b3024}.custom{display:flex;justify-content:space-between;align-items:center;margin:15px 0}.embroideryLabel{display:block;font-size:13px;margin:9px 0;color:#5a5046}.embroideryLabel input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #d4c9bc;border-radius:8px;font:inherit}.headerActions{flex-wrap:wrap}input[type=color]{width:52px;height:36px;border:1px solid #ddd;background:white;border-radius:6px}p{font-size:12px;color:#82786b;line-height:1.8}.actions{display:grid;gap:10px;margin-top:28px}.position-reset{margin-top:8px;font-size:13px;padding:8px 12px}canvas{touch-action:none;cursor:grab}canvas.dragging{cursor:grabbing}.primary{background:#29241f;color:white}.price{border-top:1px solid #eee;margin-top:25px;padding-top:20px;display:flex;justify-content:space-between}.price b{font-size:22px}#status{min-height:22px}.zoom{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:15px}@media(max-width:760px){main{grid-template-columns:1fr;padding:15px;gap:15px}.image-frame{height:52vh;min-height:300px}.headerActions{gap:8px}.headerActions span{display:none}header{padding:16px}header span{font-size:12px}aside{padding:20px}}</style><header><b>ENLUMO</b><div class="headerActions"><span>カラーシミュレーター</span><button id="goTop">← トップページに戻る</button></div></header><main id="simulator"><section><div class="stage"><div class="tabs"><button id="front" class="active">捕球面</button><button id="back">手の甲側</button><button id="pinky">小指側</button><button id="thumb">親指側</button></div><div class="image-frame"><canvas id="canvas" aria-label="グローブのカラープレビュー"></canvas></div><div class="zoom"><button id="minus" aria-label="縮小">−</button><span id="zoomLabel">100%</span><button id="plus" aria-label="拡大">＋</button></div></div><p id="status" role="status">画像を読み込んでいます…</p></section><aside><h2>革と紐をカスタマイズ</h2><h3>革の色（白い部分）</h3><div id="bodyPalette" class="palette"></div><h3>紐の色（キャメルの部分）</h3><div id="lacePalette" class="palette"></div><h3>刺繍・文字入れ</h3><div id="embroideryControls"></div><p>入力した文字は指定位置に表示されます。文字はグローブの丸みに沿って配置します。文字を入力したあと、画像上でドラッグすると位置を動かせます。手の甲側の指の文字は横書きです。</p><button id="resetTextPositions" class="position-reset">文字位置を戻す</button><div class="actions"><button id="reset">元の色に戻す</button><button class="primary" id="download">この面の画像を保存</button></div><div class="price"><span>税込価格</span><b>¥55,000</b></div><button id="nextPage" type="button" style="display:block;width:100%;margin-top:16px;padding:14px 18px;border:0;border-radius:999px;background:#29241f;color:#fff;text-align:center;font-weight:700;font-size:14px;">お客様情報を入力する</button><p>画面の色は完成イメージです。実物の革・紐とは色味が異なる場合があります。</p></aside></main><script>
const sources={front:'view-0.webp',back:'view-1.webp',pinky:'view-2.webp',thumb:'view-3.webp'};
const defaults={body:'#eee8dc',lace:'#bc762b'};let face='front',zoom=1,colors={...defaults},cache={},ready=false;const embroidery={front:{palm:''},back:{pinky:'',ring:'',middle:'',index:'',thumb:'',wrist:''}};const zones={front:[['palm','捕球面']],back:[['pinky','小指'],['ring','薬指'],['middle','中指'],['index','人差し指'],['thumb','親指'],['wrist','手首']],pinky:[['pinky','小指（側面プレビュー）']],thumb:[['thumb','親指（側面プレビュー）']]};const positionDefaults={front:{palm:{x:.5,y:.67}},back:{pinky:{x:.22,y:.36},ring:{x:.385,y:.34},middle:{x:.54,y:.33},index:{x:.69,y:.34},thumb:{x:.835,y:.43},wrist:{x:.5,y:.86}},pinky:{pinky:{x:.5,y:.50}},thumb:{thumb:{x:.5,y:.50}}};const positions=JSON.parse(JSON.stringify(positionDefaults));let textBoxes=[],dragState=null;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
const palette=[['アイボリー','#eee8dc'],['ホワイト','#ffffff'],['キャメル','#c98a43'],['キャメルの紐','#bc762b'],['オレンジ','#e87522'],['ピンク','#e9a7bb'],['レッド','#b72f3d'],['ネイビー','#203c63'],['ブラック','#242424'],['ゴールド','#c8a15b']];
function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255)}
function load(src,key){return new Promise((res,rej)=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);let d=x.getImageData(0,0,c.width,c.height);let weights=new Float32Array(im.width*im.height*2);for(let i=0;i<d.data.length;i+=4){let r=d.data[i]/255,g=d.data[i+1]/255,b=d.data[i+2]/255,max=Math.max(r,g,b),min=Math.min(r,g,b),sat=max? (max-min)/max:0;let orange=Math.max(0,Math.min(1,(r-b-.07)/.18))*Math.max(0,Math.min(1,(sat-.15)/.25))*Math.max(0,Math.min(1,(r-g+.01)/.1));orange*=Math.max(0,Math.min(1,(max-.30)/.20));let neutral=(1-orange)*Math.max(0,Math.min(1,(max-.25)/.22))*Math.max(0,Math.min(1,(.48-sat)/.18));if((key==='pinky'||key==='thumb')&&min>=247&&(max-min)<5)neutral=0;weights[i/2]=neutral;weights[i/2+1]=orange;}res({d,weights,w:im.width,h:im.height})};im.onerror=rej;im.src=src})}
function faceKey(){return face==='front'?'palm':face==='pinky'?'pinky':face==='thumb'?'thumb':null}
function textEntries(){if(face==='front')return [['palm',embroidery.front.palm,.56,56,.025]];if(face==='back')return [['pinky',embroidery.back.pinky,.18,34,.014],['ring',embroidery.back.ring,.18,34,.014],['middle',embroidery.back.middle,.18,34,.014],['index',embroidery.back.index,.18,34,.014],['thumb',embroidery.back.thumb,.17,34,.014],['wrist',embroidery.back.wrist,.44,48,.01]];if(face==='pinky')return [['pinky',embroidery.back.pinky,.56,44,.018]];return [['thumb',embroidery.back.thumb,.56,44,.018]]}
function drawCurvedText(text,key,maxW,baseSize,curve){if(!text)return;let pos=positions[face][key];if(!pos)return;const chars=Array.from(text);let size=baseSize;ctx.font=`600 ${size}px serif`;let widths=chars.map(ch=>ctx.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0),limit=canvas.width*maxW;while(total>limit&&size>14){size--;ctx.font=`600 ${size}px serif`;widths=chars.map(ch=>ctx.measureText(ch).width);total=widths.reduce((a,b)=>a+b,0)}const scale=Math.min(1,limit/total),centerX=canvas.width*pos.x,centerY=canvas.height*pos.y;let cursor=-total*scale/2;ctx.font=`600 ${size}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<chars.length;i++){const w=widths[i]*scale,mid=cursor+w/2,u=total?mid/(total*scale/2):0,cy=centerY+canvas.height*curve*(1-u*u);ctx.save();ctx.translate(centerX+mid,cy);ctx.rotate(-u*curve*.5);ctx.scale(scale,1);ctx.fillText(chars[i],0,0);ctx.restore();cursor+=w}const hitW=Math.max(size*2,total*scale+size*1.2);textBoxes.push({key,x:centerX-hitW/2,y:centerY-size*1.05,w:hitW,h:size*2.1})}
function drawEmbroidery(){ctx.save();ctx.fillStyle=colors.lace;ctx.shadowColor='#ffffffaa';ctx.shadowBlur=1;textBoxes=[];for(const [key,text,maxW,size,curve] of textEntries())drawCurvedText(text,key,maxW,size,curve);ctx.restore()}
function pointOnCanvas(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener('pointerdown',e=>{const pt=pointOnCanvas(e),box=[...textBoxes].reverse().find(b=>pt.x>=b.x&&pt.x<=b.x+b.w&&pt.y>=b.y&&pt.y<=b.y+b.h);if(!box)return;const pos=positions[face][box.key];dragState={key:box.key,x:pt.x,y:pt.y,startX:pos.x,startY:pos.y};canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!dragState)return;const pt=pointOnCanvas(e);positions[face][dragState.key].x=Math.max(.06,Math.min(.94,dragState.startX+(pt.x-dragState.x)/canvas.width));positions[face][dragState.key].y=Math.max(.06,Math.min(.94,dragState.startY+(pt.y-dragState.y)/canvas.height));render()});
function endDrag(){dragState=null;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);

function render(){if(!ready)return;document.querySelector('.stage').classList.toggle('sideView',face==='pinky'||face==='thumb');let item=cache[face],out=new ImageData(new Uint8ClampedArray(item.d.data),item.w,item.h);let body=rgb(colors.body),lace=rgb(colors.lace);for(let i=0;i<out.data.length;i+=4){if(!out.data[i+3])continue;let src=item.d.data;let wb=item.weights[i/2],wl=item.weights[i/2+1];for(let k=0;k<3;k++){let value=src[i+k];if(colors.body!==defaults.body){let shade=Math.min(1.16,(src[i]+src[i+1]+src[i+2])/3/235);let v=body[k]*255*shade;value=value*(1-wb)+v*wb;}if(colors.lace!==defaults.lace){let shade=Math.min(1.32,Math.max(src[i],src[i+1],src[i+2])/235);let highlight=Math.max(0,(Math.min(src[i],src[i+1],src[i+2])-110)/145)*.55;let v=(lace[k]*shade*(1-highlight)+highlight)*255;value=value*(1-wl)+v*wl;}out.data[i+k]=value;}}canvas.width=item.w;canvas.height=item.h;ctx.putImageData(out,0,0);drawEmbroidery();canvas.style.width='auto';canvas.style.height='auto';canvas.style.transform=`scale(${zoom})`;canvas.style.margin='0';document.querySelector('#zoomLabel').textContent=Math.round(zoom*100)+'%';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===face));for(let key of ['body','lace']){document.querySelectorAll('#'+key+'Palette button').forEach(b=>b.classList.toggle('selected',b.dataset.color===colors[key]));}document.querySelector('#status').textContent=({front:'捕球面',back:'手の甲側',pinky:'小指側',thumb:'親指側'}[face])+'を表示中';}
for(let key of ['body','lace']){for(let [name,color] of palette){let b=document.createElement('button');b.className='swatch';b.style.background=color;b.title=name;b.setAttribute('aria-label',name);b.dataset.color=color;b.onclick=()=>{colors[key]=color;render()};document.querySelector('#'+key+'Palette').append(b);}}
function renderEmbroideryControls(){const box=document.querySelector('#embroideryControls');box.replaceChildren();for(const [key,label] of zones[face]){const lab=document.createElement('label');lab.className='embroideryLabel';lab.textContent=label;const input=document.createElement('input');input.type='text';input.maxLength=18;input.placeholder=face==='front'?'例：結婚おめでとう':'文字を入力';input.value=(face==='front'?embroidery.front[key]:embroidery.back[key]);input.setAttribute('aria-label',label+'の刺繍文字');input.oninput=()=>{if(face==='front')embroidery.front[key]=input.value;else embroidery.back[key]=input.value;render()};lab.append(input);box.append(lab)}}
for(let f of ['front','back','pinky','thumb'])document.querySelector('#'+f).onclick=()=>{face=f;renderEmbroideryControls();render()};
document.querySelector('#plus').onclick=()=>{zoom=Math.min(1.3,Math.round((zoom+.1)*10)/10);render()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.6,Math.round((zoom-.1)*10)/10);render()};document.querySelector('#goTop').onclick=()=>{location.href='../index.html'};document.querySelector('#resetTextPositions').onclick=()=>{for(const f of Object.keys(positionDefaults))positions[f]=JSON.parse(JSON.stringify(positionDefaults[f]));render()};document.querySelector('#reset').onclick=()=>{colors={...defaults};zoom=1;render()};
function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;a.click()}
document.querySelector('#download').onclick=()=>{if(ready)download(canvas.toDataURL('image/png'),'ENLUMO-'+face+'.png')};
function buildOrderUrl(){const name=hex=>palette.find(([,color])=>color===hex)?.[0]||hex;const items=[['捕球面',embroidery.front.palm],['小指',embroidery.back.pinky],['薬指',embroidery.back.ring],['中指',embroidery.back.middle],['人差し指',embroidery.back.index],['親指',embroidery.back.thumb],['手首',embroidery.back.wrist]];const embroideryText=items.map(([label,value])=>`${label}：${value||'なし'}`).join(' / ');const params=new URLSearchParams({model:'ENLUMO カスタムグローブ',body:name(colors.body),lace:name(colors.lace),stitch:'未指定',embroidery:embroideryText,price:'55000'});return `../order.html?${params.toString()}`;}
document.querySelector('#nextPage').onclick=()=>{location.href=buildOrderUrl()};
Promise.all(Object.entries(sources).map(async([key,src])=>cache[key]=await load(src,key))).then(()=>{ready=true;renderEmbroideryControls();render()}).catch(()=>document.querySelector('#status').textContent='画像を読み込めませんでした。ページを開き直してください。');
</script></html>
