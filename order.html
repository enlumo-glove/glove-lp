<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご注文内容の入力｜ENLUMO</title>
  <meta name="description" content="ENLUMO オーダーグローブのご注文内容・お客様情報入力ページ">
  <style>
    :root{--bg:#faf8f4;--card:#fffdfa;--text:#2f2924;--muted:#81786f;--line:#e8dfd4;--accent:#2f2924;--soft:#f3eee7;--danger:#9f3a32}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;line-height:1.75}
    a{color:inherit}.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 26px;border-bottom:1px solid var(--line)}
    .brand{font-size:28px;letter-spacing:.18em;font-weight:700;text-decoration:none}
    .back{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;color:var(--muted);text-decoration:none}
    .hero{padding:38px 0 28px}.eyebrow{margin:0 0 8px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--muted)}
    h1{font-size:clamp(28px,4vw,42px);margin:0 0 10px;line-height:1.35}.lead{margin:0;color:var(--muted);font-size:15px}
    .grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:24px;align-items:start}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}.card h2{font-size:21px;margin:0 0 18px}
    .preview{min-height:230px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#f6f1ea,#fffdfa);display:flex;align-items:center;justify-content:center;margin-bottom:20px;text-align:center;padding:18px}
    .glove-mark{width:150px;height:120px;border:5px solid #6d1f1c;background:#b7473e;border-radius:46% 54% 47% 53% / 44% 46% 54% 56%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;letter-spacing:.08em;box-shadow:0 8px 18px rgba(47,41,36,.08)}
    .preview small{display:block;margin-top:12px;color:var(--muted);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.preview img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:10px}.consent-links{font-size:12px;color:var(--muted)}.check .policy-link{font-weight:500}
    .summary{margin:0}.summary-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
    .summary-row dt{color:var(--muted)}.summary-row dd{margin:0;font-weight:600;text-align:right}
    .price-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:20px}.price-row span{color:var(--muted);font-size:14px}
    .price{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:28px;font-weight:700}
    .delivery{margin-top:18px;padding:15px 16px;border-radius:12px;background:var(--soft);font-size:14px}.delivery strong{display:block;margin-bottom:4px}
    .field{margin-bottom:17px}label{display:block;font-size:14px;font-weight:600;margin-bottom:7px}
    .required{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;margin-left:7px;color:var(--danger)}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);padding:12px 13px;font-size:16px;outline:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    input:focus,textarea:focus{border-color:#9c8d7e;box-shadow:0 0 0 3px rgba(156,141,126,.12)}textarea{min-height:100px;resize:vertical}
    .help{font-size:12px;color:var(--muted);margin-top:6px}
    .check{display:flex;gap:10px;align-items:flex-start;margin:22px 0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
    .check input{width:18px;height:18px;margin-top:3px}.actions{display:grid;gap:10px}
    button,.secondary{min-height:50px;border-radius:12px;padding:13px 18px;font-size:15px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    button{border:1px solid var(--accent);background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}
    .note{margin-top:12px;color:var(--muted);font-size:12px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    @media(max-width:820px){.wrap{padding:20px 15px 48px}header{padding-bottom:18px}.brand{font-size:24px}.hero{padding:28px 0 20px}.grid{grid-template-columns:1fr}.card{padding:18px}.preview{min-height:190px}}
  </style>
  <link rel="stylesheet" href="./order-support.css">
  <script src="./order-support.js?v=20261109-friend-only"></script>
<link rel="stylesheet" href="./brand.css"></head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./index.html"><img class="brand-lockup" src="./enlumo-logo-swallows.webp" alt="ENLUMO" width="240" height="52"></a>
      <a class="back" href="./custom/">← シミュレーションに戻る</a>
    </header>

    <section class="hero">
      <p class="eyebrow">ORDER REQUEST</p>
      <h1>このグローブで注文を相談する</h1>
      <p class="lead">LINEのご登録後、シミュレーション内容とお客様情報をご確認ください。</p>
    </section>

    <div class="grid">
      <section class="card">
        <h2>シミュレーション内容</h2>
        <div class="preview"><div><img id="preview-image" alt="選択したグローブのシミュレーション" hidden><div class="glove-mark" id="preview-placeholder">ENLUMO<br>GLOVE</div><small>選択したグローブのシミュレーション</small>
          </div>
        </div>
        <dl class="summary">
          <div class="summary-row"><dt>モデル</dt><dd id="show-model">内野手用</dd></div>
          <div class="summary-row"><dt>本体カラー</dt><dd id="show-body">レッド</dd></div>
          <div class="summary-row"><dt>レース</dt><dd id="show-lace">ネイビー</dd></div>
          <div class="summary-row"><dt>ステッチ</dt><dd id="show-stitch">ホワイト</dd></div>
          <div class="summary-row"><dt>刺繍</dt><dd id="show-embroidery">なし</dd></div>
          <div class="summary-row"><dt>刺繍数</dt><dd id="show-count">0箇所</dd></div>
          <div class="summary-row"><dt>刺繍追加料金</dt><dd id="show-extra">¥0</dd></div>
        </dl>
        <div class="price-row">
          <span>商品価格</span>
          <div><span class="price" id="show-price">¥55,000</span> <small>税込</small></div>
        </div>
        <div class="delivery">
          <strong>納期の目安：約2か月</strong>
          ご注文内容の確定後、完成・発送まで約2か月程度を予定しています。仕様や時期により前後する場合があります。
        </div>
      </section>

      <section class="card">
        <form id="order-form">
          <div data-contact-preference></div>
          <h2>STEP 2 / お客様情報</h2>
          <input type="hidden" name="model" id="model">
          <input type="hidden" name="body" id="body">
          <input type="hidden" name="lace" id="lace">
          <input type="hidden" name="stitch" id="stitch">
          <input type="hidden" name="embroidery" id="embroidery"><input type="hidden" name="embroidery_layout" id="embroidery_layout">
          <input type="hidden" name="price" id="price">
          <input type="hidden" name="embroidery_count" id="embroidery_count">
          <input type="hidden" name="embroidery_extra" id="embroidery_extra">

          <div class="field">
            <label for="name">お名前<span class="required">必須</span></label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="山田 太郎" required>
          </div>
          <div class="field">
            <label for="kana">お名前（フリガナ）<span class="required">必須</span></label>
            <input id="kana" name="kana" type="text" placeholder="ヤマダ タロウ" required>
          </div>
          <div class="field">
            <label for="email">メールアドレス<span class="required">必須</span></label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required>
          </div>
          <div class="field">
            <label for="tel">電話番号<span class="required">必須</span></label>
            <input id="tel" name="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678" required>
          </div>
          <div class="field">
            <label for="postal">郵便番号<span class="required">必須</span></label>
            <input id="postal" name="postal" type="text" autocomplete="postal-code" inputmode="numeric" placeholder="123-4567" required>
          </div>
          <div class="field">
            <label for="address">住所<span class="required">必須</span></label>
            <textarea id="address" name="address" autocomplete="street-address" placeholder="東京都〇〇区〇〇 1-2-3" required></textarea>
          </div>
          <div class="field">
            <label for="note">備考</label>
            <textarea id="note" name="note" placeholder="刺繍・納期など、ご希望があればご記入ください。"></textarea>
          </div>

          <label class="check"><input type="checkbox" name="privacy_consent" value="yes" required><span><a class="policy-link" href="./index.html#privacy-policy" target="_blank" rel="noopener">プライバシーポリシー</a>を確認し、同意します。</span></label>
          <label class="check"><input type="checkbox" name="acquisition_consent" value="yes" required><span><a class="policy-link" href="./index.html#personal-data-acquisition" target="_blank" rel="noopener">個人情報の取得・利用に関する説明</a>に同意します。</span></label>
          <label class="check"><input type="checkbox" name="specification_consent" value="yes" required><span>グローブの仕様・価格・納期目安（約2か月）を確認しました。</span></label>
          <div class="actions">
            <button type="submit">入力内容を確認する</button>
            <a class="secondary" href="./custom/">シミュレーションに戻る</a>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const defaults = {
        model: "内野手用",
        body: "レッド",
        lace: "ネイビー",
        stitch: "ホワイト",
        embroidery: "R. Takumi",
        embroidery_layout: "",
        price: "55000"
      };

      const form = document.getElementById("order-form");
      ENLUMOSupport.mount(form, params);
      for (const key of ["name","kana","email","tel","postal","address","note"]) {
        if (params.has(key)) form.elements[key].value = params.get(key);
      }
      form.addEventListener("submit", event => {
        const error = ENLUMOSupport.validateContact(Object.fromEntries(new FormData(form)));
        if (error) { event.preventDefault(); alert(error); }
      });
      const values = {};
      Object.keys(defaults).forEach(key => {
        values[key] = key === "price" ? defaults.price : (params.get(key) || defaults[key]);
        const hidden = document.getElementById(key);
        if (hidden) hidden.value = values[key];
      });

      document.getElementById("show-model").textContent = values.model;
      document.getElementById("show-body").textContent = values.body;
      document.getElementById("show-lace").textContent = values.lace;
      document.getElementById("show-stitch").textContent = values.stitch;
      document.getElementById("show-embroidery").textContent = values.embroidery;

      const priceNumber = Number(String(values.price).replace(/[^\d]/g,"")) || 55000;
      document.getElementById("show-price").textContent = "¥" + priceNumber.toLocaleString("ja-JP");
    })();
  </script>
</body>
</html>  <script>
    (() => {
      let saved={};try{saved=JSON.parse(sessionStorage.getItem("enlumo_order_draft")||"{}");}catch{}
      const form=document.getElementById("order-form");
      const restore={...(saved.customer||{}),...Object.fromEntries(new URLSearchParams(location.search))};
      ENLUMOSupport.mount(form,new URLSearchParams(restore));
      const defaults={model:"ENLUMO カスタムグローブ",body:"アイボリー",lace:"ゴールド",stitch:"#76513b",embroidery:"なし",embroidery_layout:"",embroidery_count:"0",embroidery_extra:"0",price:"55000"};
      const values={...defaults,...saved};
      for(const key of Object.keys(defaults)){const el=document.getElementById(key);if(el)el.value=String(values[key]??defaults[key]);}
      const prior=saved.customer||{};
      for(const key of ["name","kana","email","tel","postal","address","note"])if(prior[key])form.elements[key].value=prior[key];
      for(const key of ["privacy_consent","acquisition_consent","specification_consent"])if(prior[key]==="yes"&&form.elements[key])form.elements[key].checked=true;
      document.getElementById("show-model").textContent=values.model;
      document.getElementById("show-body").textContent=values.body;
      document.getElementById("show-lace").textContent=values.lace;
      document.getElementById("show-stitch").textContent=values.stitch;
      document.getElementById("show-embroidery").textContent=values.embroidery;
      const count=Number(values.embroidery_count)||0,extra=Number(values.embroidery_extra)||0,price=Number(values.price)||55000;
      document.getElementById("show-count").textContent=count+"箇所";
      document.getElementById("show-extra").textContent="¥"+extra.toLocaleString("ja-JP");
      document.getElementById("show-price").textContent="¥"+price.toLocaleString("ja-JP");
      if(saved.preview){const image=document.getElementById("preview-image");image.src=saved.preview;image.hidden=false;document.getElementById("preview-placeholder").hidden=true;}
      form.addEventListener("submit",event=>{
        event.preventDefault();
        if(!form.reportValidity())return;
        const customer=Object.fromEntries(new FormData(form));
        const error=ENLUMOSupport.validateContact(customer);
        if(error){alert(error);return;}
        sessionStorage.setItem("enlumo_order_draft",JSON.stringify({...values,customer}));
        location.href="./confirm.html";
      });
    })();
  </script>
</body>
</html>
