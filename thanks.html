<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お問い合わせありがとうございます｜ENLUMO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      color: #2f2924;
      background: #faf8f4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    header {
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8dfd4;
    }

    .logo {
      font-size: 28px;
      font-style: italic;
      letter-spacing: 2px;
    }

    .back-btn {
      font-size: 14px;
      color: #6f5a43;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .thanks-box {
      max-width: 650px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      padding: 70px 40px;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.06);
    }

    .eyebrow {
      color: #9a7652;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border: 1px solid #b99a78;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #9a7652;
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    .message {
      color: #766b61;
      font-size: 16px;
      line-height: 2;
      margin-bottom: 40px;
    }

    .message strong {
      color: #2f2924;
      font-weight: 500;
    }

    .home-btn {
      display: inline-block;
      background: #3b3027;
      color: white;
      padding: 17px 45px;
      border-radius: 40px;
      font-size: 15px;
      transition: 0.3s;
    }

    .home-btn:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 30px;
      font-size: 12px;
      color: #9a9188;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #251e19;
      color: #cfc6bd;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 20px;
      }

      .logo {
        font-size: 23px;
      }

      main {
        padding: 40px 15px;
      }

      .thanks-box {
        padding: 50px 25px;
      }

      .message {
        font-size: 14px;
      }
    }
  </style>
<style>[hidden]{display:none!important}</style><link rel="stylesheet" href="./brand.css"></head>

<body>

  <header>
    <a href="./index.html" class="logo"><img class="brand-lockup" src="./enlumo-logo-swallows.webp" alt="ENLUMO" width="240" height="52"></a>
    <a href="./index.html" class="back-btn">← トップページへ戻る</a>
  </header>

  <main>
    <div class="thanks-box">

      <div class="eyebrow">THANK YOU</div>

      <div class="check">✓</div>

      <h1>お問い合わせありがとうございます</h1>

      <p class="message">
        ご相談内容を受け付けました。<br>
        内容を確認のうえ、<strong>担当者よりご連絡いたします。</strong><br><br>
        ENLUMOは、あなたの大切な想いを<br>
        ひとつのグローブに込めるお手伝いをします。
      </p>

      <a href="https://lin.ee/WQajS4j" class="home-btn" id="next-contact" target="_blank" rel="noopener noreferrer">
        LINEのトーク画面を開く
      </a>
      <br><br><a href="./index.html" class="back-btn">
        トップページへ戻る
      </a>

      <p class="note" id="reply-note">
        LINE対応の方は、ENLUMO公式LINEのトーク画面でご連絡をお待ちください。
      </p>

    </div>
  </main>

  <footer>
    © ENLUMO MEMORIAL GLOVE
  </footer>

<script>
const params = new URLSearchParams(location.search);
if (params.get('channel') === 'email') {
  document.getElementById('reply-note').textContent = 'ご入力いただいたメールアドレスへご連絡します。迷惑メールフォルダもご確認ください。';
  document.getElementById('next-contact').hidden = true;
}
if (params.get('type') === 'order') {
  document.querySelector('h1').textContent = '注文リクエストを受け付けました';
  document.querySelector('.message').textContent = '担当者より、ご指定の連絡方法で仕様・刺繍・納期の確認をさせていただきます。内容の確定・ご入金後に正式なご注文となります。';
}
</script></body>
</html>
